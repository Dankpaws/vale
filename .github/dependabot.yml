version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Keep private staging single-history; enable update PRs at the public gate.
    open-pull-requests-limit: 0

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Keep private staging single-history; enable update PRs at the public gate.
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Keep private staging single-history; enable update PRs at the public gate.
    open-pull-requests-limit: 0
