name: Pull Request

env:
  CARGO_TERM_COLOR: always

on:
  push:
    branches:
      - 'main'

  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

jobs:
  test:
    name: deterministic tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned release toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Run deterministic tests
        run: |
          cargo test --locked
          node --test tests/js/*.test.mjs

  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install the minimum supported toolchain
        uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
      - name: Check every target on the locked graph
        run: cargo check --locked --all-targets

  format:
    name: cargo fmt --all -- --check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned toolchain with rustfmt
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: rustfmt

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -- -D warnings
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned toolchain with clippy
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0
        with:
          components: clippy

      - name: Run cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  licenses:
    name: third-party license inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install the pinned license generator
        run: cargo install cargo-about --version 0.9.2 --locked --features cli

      - name: Verify the locked dependency notices
        run: |
          scripts/update_rust_licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.html

  dependency-audit:
    name: vulnerability and unused-dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@f8be11a05b1d4f3fcebe6410cc16743212b999b0 # 1.98.0

      - name: Install pinned audit tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-machete --version 0.9.2 --locked

      - name: Audit the locked graph
        run: |
          set -euo pipefail
          cargo audit --ignore RUSTSEC-2025-0141
          cargo machete
