[package]
name = "redlib"
description = "Vale, a quiet subscription-first reader for Reddit communities"
license = "AGPL-3.0-only"
version = "0.36.1"
publish = false
readme = "README.md"
repository = "https://github.com/Dankpaws/vale"
homepage = "https://github.com/Dankpaws/vale"
authors = [
    "Matthew Esposito <matt+cargo@matthew.science>",
    "spikecodes <19519553+spikecodes@users.noreply.github.com>",
    "Dankpaws <322286514+Dankpaws@users.noreply.github.com>",
]
edition = "2021"
rust-version = "1.88"
default-run = "redlib"

[dependencies]
ammonia = "=4.1.4"
askama = { version = "0.14.0", default-features = false, features = [
    "std",
    "derive",
] }
cached = { version = "0.59.0", features = ["async"] }
clap = { version = "4.4.11", default-features = false, features = [
    "std",
    "env",
    "derive",
    "help",
    "usage",
    "error-context",
    "suggestions",
] }
regex = "1.10.2"
serde = { version = "1.0.193", features = ["derive"] }
cookie = "0.18.0"
futures-lite = "2.2.0"
hyper = { version = "0.14.31", features = ["http1", "server", "stream", "tcp"] }
percent-encoding = "2.3.1"
route-recognizer = "0.3.1"
serde_json = "1.0.133"
tokio = { version = "1.44.2", features = ["full"] }
time = { version = "0.3.31", features = ["local-offset"] }
url = "2.5.0"
flate2 = "1.1.9"
brotli = { version = "7.0.0", features = ["std"] }
toml = "0.8.8"
uuid = { version = "1.6.1", features = ["v4"] }
base64 = "0.22.1"
fastrand = "2.0.1"
log = "0.4.20"
lol_html = { version = "=3.0.1", default-features = false }
pretty_env_logger = "0.5.0"
dotenvy = "0.15.7"
rss = "2.1.0"
arc-swap = "1.7.1"
async-recursion = "1.1.1"
pulldown-cmark = { version = "0.13.3", features = ["simd", "html"], default-features = false }
serde_urlencoded = "0.7.1"
chrono = { version = "0.4.39", default-features = false, features = ["std"] }
htmlescape = "0.3.1"
bincode = "1.3.3"
base2048 = "2.0.2"
revision = "0.17.0"
wreq = { version = "=6.0.0-rc.28", features = ["brotli", "gzip", "deflate", "zstd", "json", "stream", "socks"] }
wreq-util = { version = "=3.0.0-rc.10" }
argon2 = "0.5.3"
getrandom = "0.3.4"
rand_core = { version = "0.6.4", features = ["getrandom"] }
rpassword = "7.5.4"
rusqlite = { version = "0.32.1", features = ["bundled"] }
sha2 = "0.10.8"
tokio-util = { version = "0.7.16", features = ["io"] }
zip = { version = "0.6.6", default-features = false }
zeroize = "1.8.1"

[dev-dependencies]
sealed_test = "1.0.0"

[profile.release]
codegen-units = 1
lto = true
# Distribution containers strip the final Linux executable with the platform's
# native binutils. Keep local Cargo builds portable across supported hosts.
strip = false
